name: M2 scoreboard clock

on:
  schedule:
    - cron: "17 21 * * 1-5" # Grade after the weekday G.19 release window.
    - cron: "17 23 * * 1-5" # Check H.8 after regular and holiday-shifted releases.
    - cron: "43 14 * * 1" # Check for a newly complete quarterly attribution input set.
  workflow_dispatch:
    inputs:
      job:
        description: Clock operation to run
        required: true
        default: all
        type: choice
        options: [predict, grade, refresh, all]
      force_publish:
        description: Publish even when no ledger row was appended
        required: true
        default: false
        type: boolean
      bootstrap_state:
        description: Deprecated compatibility input; Git ledger state is always restored
        required: true
        default: false
        type: boolean

concurrency:
  group: dfri-m2-scoreboard
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    outputs:
      publish: ${{ steps.clock.outputs.publish }}
      mode: ${{ steps.clock.outputs.mode }}
      source_release_at: ${{ steps.clock.outputs.source_release_at }}
      published_at: ${{ steps.clock.outputs.published_at }}
      prediction_appended: ${{ steps.clock.outputs.prediction_appended }}
      grade_appended: ${{ steps.clock.outputs.grade_appended }}
      attribution_refresh_appended: ${{ steps.clock.outputs.attribution_refresh_appended }}
    steps:
      - name: Check out the default-branch clock definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install the locked project
        run: make bootstrap

      - name: Restore the newest redundant runtime cache when available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          restored=false
          while read -r run_id; do
            [[ -z "$run_id" ]] && continue
            candidate="$RUNNER_TEMP/dfri-state-$run_id"
            if gh run download "$run_id" -n dfri-m2-state -D "$candidate"; then
              uv run python -m dfri.ops.state_bundle unpack \
                --bundle "$candidate/runtime-state.tar.gz" \
                --root .local
              restored=true
              break
            fi
          done < <(
            gh run list \
              --workflow m2-scoreboard.yml \
              --branch "$GITHUB_REF_NAME" \
              --status completed \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'
          )
          if [[ "$restored" == false ]]; then
            echo "No retained runtime cache is available; rebuilding from Git and public sources."
          fi

      - name: Restore Git-authoritative public ledgers
        run: |
          uv run python -m dfri.ops.repository_ledger restore \
            --repository-root state/ledgers \
            --runtime-root .local/lake/curated

      - name: Refresh only the public-source nowcast lake
        shell: bash
        run: |
          set -euo pipefail
          make BOARD_START=2015-01-01 board-backfill
          make BOARD_TARGET_START=2015-01-01 board-targets
          make CENSUS_ARCHIVE_START=2015-01-01 census-archive

      - name: Run the append-only clock jobs
        id: clock
        shell: bash
        env:
          DISPATCH_JOB: ${{ inputs.job }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          run_at="$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)"
          mode="$DISPATCH_JOB"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            if [[ "$SCHEDULE_EXPRESSION" == "17 23 * * 1-5" ]]; then
              mode=predict
            elif [[ "$SCHEDULE_EXPRESSION" == "43 14 * * 1" ]]; then
              mode=refresh
            else
              mode=grade
            fi
          fi
          prediction_appended=0
          grade_appended=0
          attribution_refresh_appended=0
          release_times=()
          if [[ "$mode" == predict || "$mode" == all ]]; then
            prediction_json="$(uv run python -m dfri.scoreboard predict --as-of "$run_at")"
            echo "$prediction_json"
            prediction_appended="$(jq -r '.appended' <<<"$prediction_json")"
            if (( prediction_appended > 0 )); then
              release_times+=("$(jq -r '[.series[].h8_release_at] | min' <<<"$prediction_json")")
            fi
          fi
          if [[ "$mode" == grade || "$mode" == all ]]; then
            grade_json="$(uv run python -m dfri.scoreboard grade --as-of "$run_at")"
            echo "$grade_json"
            grade_appended="$(jq -r '.appended' <<<"$grade_json")"
            if (( grade_appended > 0 )); then
              release_times+=("$(jq -r '.latest_graded_at' <<<"$grade_json")")
            fi
          fi
          if [[ "$mode" == refresh ]]; then
            refresh_json="$(uv run python -m dfri.ops.quarterly_refresh \
              --as-of "$run_at" \
              --output ".local/evidence/quarterly_refresh/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json")"
            echo "$refresh_json"
            attribution_refresh_appended="$(jq -r '.appended' <<<"$refresh_json")"
            if (( attribution_refresh_appended > 0 )); then
              release_times+=("$(jq -r '.effective_at' <<<"$refresh_json")")
            fi
          fi
          vintage_json="$(uv run python -m dfri.scoreboard data-vintage --as-of "$run_at")"
          data_vintage="$(jq -r '.data_vintage' <<<"$vintage_json")"
          changed=$(( prediction_appended + grade_appended + attribution_refresh_appended ))
          publish=false
          if (( changed > 0 )) || [[ "$FORCE_PUBLISH" == true ]]; then
            publish=true
          fi
          if (( ${#release_times[@]} == 0 )); then
            source_release_at="$data_vintage"
          else
            source_release_at="$(printf '%s\n' "${release_times[@]}" | sort | head -n 1)"
          fi
          {
            echo "publish=$publish"
            echo "mode=$mode"
            echo "source_release_at=$source_release_at"
            echo "published_at=$run_at"
            echo "prediction_appended=$prediction_appended"
            echo "grade_appended=$grade_appended"
            echo "attribution_refresh_appended=$attribution_refresh_appended"
            echo "data_vintage=$data_vintage"
          } >> "$GITHUB_OUTPUT"

      - name: Build the live immutable feed and site
        if: steps.clock.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m dfri.publish.site \
            --data-vintage "${{ steps.clock.outputs.data_vintage }}" \
            --published-at "${{ steps.clock.outputs.published_at }}" \
            --publication-mode live

      - name: Configure GitHub Pages
        if: steps.clock.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the complete Pages document root
        if: steps.clock.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: published/public

      - name: Pack the allowlisted runtime state
        shell: bash
        run: uv run python -m dfri.ops.state_bundle pack --root .local --bundle .local/runtime-state.tar.gz

      - name: Preserve candidate runtime state until Pages accepts it
        if: steps.clock.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dfri-m2-state-candidate
          path: .local/runtime-state.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Preserve accepted runtime state for a no-change run
        if: steps.clock.outputs.publish != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dfri-m2-state
          path: .local/runtime-state.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the accepted Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Download the candidate runtime state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dfri-m2-state-candidate
          path: .local/accepted-state

      - name: Preserve deployment-accepted runtime state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dfri-m2-state
          path: .local/accepted-state/runtime-state.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Check out current default branch for ledger promotion and receipt writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install pinned uv for ledger promotion
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install the locked project for ledger promotion
        run: make bootstrap

      - name: Verify and merge the deployment-accepted repository ledger candidate
        id: repository_ledger
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m dfri.ops.state_bundle unpack \
            --bundle .local/accepted-state/runtime-state.tar.gz \
            --root .local/repository-candidate-runtime
          uv run python -m dfri.ops.repository_ledger snapshot \
            --runtime-root .local/repository-candidate-runtime/lake/curated \
            --output-root .local/repository-ledger-candidate
          merge_json="$(uv run python -m dfri.ops.repository_ledger merge \
            --candidate-root .local/repository-ledger-candidate \
            --repository-root state/ledgers)"
          echo "$merge_json"
          echo "added_files=$(jq -r '.added_files' <<<"$merge_json")" >> "$GITHUB_OUTPUT"

      - name: Commit newly appended public ledger batches to Git
        if: steps.repository_ledger.outputs.added_files != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dfri-scoreboard[bot]"
          git config user.email "ops@camelon.app"
          git add -- state/ledgers
          git diff --cached --check
          while IFS=$'\t' read -r status path; do
            if [[ "$path" == "state/ledgers/MANIFEST.json" && "$status" =~ ^[AM]$ ]]; then
              continue
            fi
            if [[ "$path" == state/ledgers/*/batch-*.parquet && "$status" == "A" ]]; then
              continue
            fi
            echo "BLOCKED: staged ledger change violates append-only policy: $status $path" >&2
            exit 1
          done < <(git diff --cached --name-status)
          git commit -m "data: append immutable scoreboard ledger (run ${GITHUB_RUN_ID})"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if (( attempt == 3 )); then
              break
            fi
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
          done
          echo "BLOCKED: could not persist accepted ledger state to Git after three attempts." >&2
          exit 1

      - name: Write the deployment receipt and enforce the applicable four-hour SLA
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)"
          PYTHONPATH=src python -m dfri.ops.deployment_receipt \
            --output ".local/evidence/deployments/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            --mode "${{ needs.build.outputs.mode }}" \
            --source-release-at "${{ needs.build.outputs.source_release_at }}" \
            --published-at "${{ needs.build.outputs.published_at }}" \
            --deployed-at "$deployed_at" \
            --page-url "$PAGE_URL" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --commit-sha "$GITHUB_SHA" \
            --prediction-appended "${{ needs.build.outputs.prediction_appended }}" \
            --grade-appended "${{ needs.build.outputs.grade_appended }}" \
            --attribution-refresh-appended "${{ needs.build.outputs.attribution_refresh_appended }}"

      - name: Preserve the deployment receipt even when the SLA fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dfri-deployment-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/evidence/deployments/*.json
          if-no-files-found: error
          retention-days: 90
