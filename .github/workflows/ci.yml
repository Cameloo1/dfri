name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan complete Git history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks"
          archive="$scanner_dir/gitleaks.tar.gz"
          mkdir -p "$scanner_dir"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$scanner_dir" gitleaks
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          "$scanner_dir/gitleaks" git . \
            --log-opts="HEAD --remotes=origin --tags --full-history" \
            --redact=100 \
            --no-banner \
            --no-color
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Start the M5 end-to-end pipeline timer
        shell: bash
        run: |
          mkdir -p .local/evidence
          date -u +%s > .local/evidence/m5-ci-start-epoch
      - run: make bootstrap
      - name: Block local paths and excluded documents
        run: |
          uv run python -m dfri.ops.privacy markdown
          uv run python -m dfri.ops.privacy excluded-tracked
      - run: make verify
      - name: Verify published changelog history is append-only
        shell: bash
        run: |
          mkdir -p .local/changelog
          BASE_REF=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            BASE_REF="HEAD^"
          fi
          if [[ -n "$BASE_REF" ]] && git cat-file -e "$BASE_REF:src/dfri/publish/changelog_v1.json" 2>/dev/null; then
            git show "$BASE_REF:src/dfri/publish/changelog_v1.json" > .local/changelog/baseline.json
            uv run python -m dfri.publish.changelog --baseline .local/changelog/baseline.json
          else
            uv run python -m dfri.publish.changelog
          fi
      - run: make publish
      - name: Assert rendered publication rules
        run: make site-quality
      - name: Enforce the M5 end-to-end CI budget
        shell: bash
        run: |
          set -euo pipefail
          finished_epoch="$(date -u +%s)"
          started_epoch="$(cat .local/evidence/m5-ci-start-epoch)"
          elapsed_seconds="$(( finished_epoch - started_epoch ))"
          python - "$elapsed_seconds" <<'PY'
          import json
          import sys
          from pathlib import Path

          elapsed = int(sys.argv[1])
          payload = {
              "schema_version": "v1",
              "status": "PASS" if elapsed < 1800 else "FAIL",
              "scope": "locked bootstrap plus make verify plus make publish",
              "elapsed_seconds": elapsed,
              "budget_seconds": 1800,
              "runner": "ubuntu-latest",
          }
          Path(".local/evidence/m5-ci-performance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          raise SystemExit(0 if payload["status"] == "PASS" else 1)
          PY
      - name: Preserve publication verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-verification-${{ github.run_id }}
          path: |
            .local/evidence/m4-*.json
            .local/evidence/m5-ci-performance.json
          if-no-files-found: error
          retention-days: 90
