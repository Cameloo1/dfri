name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: make bootstrap
      - run: make verify
      - name: Verify published changelog history is append-only
        shell: bash
        run: |
          mkdir -p .local/changelog
          BASE_REF=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            BASE_REF="HEAD^"
          fi
          if [[ -n "$BASE_REF" ]] && git cat-file -e "$BASE_REF:src/dfri/publish/changelog_v1.json" 2>/dev/null; then
            git show "$BASE_REF:src/dfri/publish/changelog_v1.json" > .local/changelog/baseline.json
            uv run python -m dfri.publish.changelog --baseline .local/changelog/baseline.json
          else
            uv run python -m dfri.publish.changelog
          fi
      - run: make publish
      - name: Preserve publication verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-publication-verification-${{ github.run_id }}
          path: .local/evidence/m4-*.json
          if-no-files-found: error
          retention-days: 90
