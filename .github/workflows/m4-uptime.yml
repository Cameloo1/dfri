name: M4 public uptime and freshness

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m4-uptime
  cancel-in-progress: false

jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DFRI_API_BASE_URL: ${{ vars.DFRI_API_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Check public site, feeds, freshness, and configured API
        shell: bash
        run: |
          mkdir -p .local/evidence/uptime
          ARGS=(
            --site-base https://cameloo1.github.io/dfri/
            --output ".local/evidence/uptime/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          )
          if [[ -n "$DFRI_API_BASE_URL" ]]; then
            ARGS+=(--api-base "$DFRI_API_BASE_URL" --require-api)
          fi
          uv run python -m dfri.ops.uptime "${ARGS[@]}"
      - name: Preserve owner-readable uptime receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-uptime-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/evidence/uptime/*.json
          if-no-files-found: error
          retention-days: 90
